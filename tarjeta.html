<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Williams Neira Garrido - Tarjeta Digital</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #1e293b;
            --accent-green: #25d366;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .main-container {
            width: 100%;
            max-width: 390px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 14px 16px;
            position: relative;
        }

        /* Línea superior corporativa */
        .brand-bar {
            display: flex;
            height: 4px;
            width: 100%;
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .brand-bar .b1 { background: #1e293b; flex: 1; }
        .brand-bar .b2 { background: #0f766e; flex: 1; }
        .brand-bar .b3 { background: #25d366; flex: 1; }

        /* Logo superior centrado */
        .header-logo {
            text-align: center;
            padding: 2px 0 8px 0;
        }

        .header-logo img {
            max-width: 140px;
            height: auto;
            max-height: 50px;
            object-fit: contain;
        }

        /* Tarjeta de perfil */
        .preview-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px;
            background: #fafafa;
            margin-bottom: 12px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
        }

        .preview-info {
            text-align: left;
        }

        .preview-info h2 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 2px;
        }

        .preview-info h3 {
            font-size: 12px;
            font-weight: 600;
            color: #0f766e;
            margin-bottom: 5px;
        }

        .preview-info p {
            font-size: 10.5px;
            color: var(--text-muted);
            line-height: 1.3;
            margin-bottom: 6px;
        }

        .preview-info .contact-details {
            font-size: 10.5px;
            color: #374151;
            font-weight: 500;
            line-height: 1.45;
        }

        /* Botones de acción */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13.5px;
            transition: all 0.2s ease;
        }

        .btn-main {
            background-color: var(--primary-dark);
            color: #ffffff;
        }

        .btn-whatsapp {
            background-color: var(--accent-green);
            color: #ffffff;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-sub {
            background-color: #f1f5f9;
            color: #334155;
            font-size: 12.5px;
        }

        .btn-sub i {
            color: #64748b;
        }

        /* Sección Código QR */
        .qr-section {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #f1f5f9;
            text-align: center;
        }

        .qr-title {
            font-size: 9.5px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .qr-box {
            width: 95px;
            height: 95px;
            margin: 0 auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 4px;
            background: #ffffff;
        }

        .qr-box img {
            width: 100%;
            height: 100%;
        }

        .footer {
            text-align: center;
            margin-top: 8px;
            font-size: 9.5px;
            color: var(--text-muted);
        }
    </style>
</head>
